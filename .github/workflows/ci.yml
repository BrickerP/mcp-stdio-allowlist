name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Demo (full E2E)
        env:
          PYTHONPATH: src
        run: python3 -m mcp_stdio_allowlist demo
      - name: Demo JPM money gate (2026-10-15)
        env:
          PYTHONPATH: src
        run: python3 -m mcp_stdio_allowlist demo-jpm
      - name: Report artifacts exist
        run: |
          test -f docs/demo-report.html
          test -f docs/demo-jpm-report.html
          test -f docs/demo-jpm-spans.jsonl

  prompt-injection-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Inspect AI
        run: pip install -e ".[eval]"
      - name: Held-out prompt-injection eval (regression gate)
        env:
          PYTHONPATH: src
        run: python3 scripts/run_heldout_eval.py --min-block-rate 1.0 --max-false-block-rate 0.0
